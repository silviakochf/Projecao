<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PAESTRO — {% block title %}Progressão{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body>
<nav>
  <span class="nav-logo">🎓 PAESTRO</span>
  <a href="/" class="nav-btn {% if request.path=='/' %}active{% endif %}"><i class="fas fa-home"></i> Início</a>
  <a href="/progressao" class="nav-btn {% if request.path=='/progressao' %}active{% endif %}"><i class="fas fa-graduation-cap"></i> Progressão</a>
  <a href="/cartas" class="nav-btn {% if request.path=='/cartas' %}active{% endif %}"><i class="fas fa-envelope"></i> Cartas</a>
</nav>
<div id="toast"></div>
<main>{% block content %}{% endblock %}</main>
<footer>Secretaria de Educação — Palhoça © {{ now.year }}</footer>
{# toast(), postJSON(), postForm(), downloadBlob()... ficam SOMENTE em main.js (não repetir aqui) #}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
